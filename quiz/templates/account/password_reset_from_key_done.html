{% load static %}
<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Senha alterada — SantuarioEdu</title>
{% include "includes/favicon.html" %}
{% include "account/_auth_head.html" %}
</head>
<body class="min-h-screen flex items-center justify-center bg-surface-container-low px-4 py-8">

<main class="w-full max-w-[440px]">
  <div class="mb-8 text-center">
    <h1 class="font-serif text-3xl font-bold text-primary tracking-tight mb-2">SantuarioEdu</h1>
  </div>

  <section class="paper-card bg-white w-full rounded-xl border border-outline-variant/30 p-8 md:p-10 text-center">
    <div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center mx-auto mb-5">
      <span class="material-symbols-outlined text-secondary" style="font-size:28px;font-variation-settings:'FILL' 1;">check_circle</span>
    </div>

    <h2 class="font-serif text-xl font-semibold text-on-surface mb-3">Senha alterada</h2>
    <p class="text-sm text-on-surface-variant mb-8 leading-relaxed">
      Sua nova senha foi salva com sucesso. Use-a para entrar na plataforma.
    </p>

    <a href="{% url 'account_login' %}"
       class="inline-flex items-center gap-2 h-11 px-6 bg-primary text-on-primary font-semibold text-sm rounded-lg hover:opacity-90 transition-all">
      Entrar agora
      <span class="material-symbols-outlined" style="font-size:18px;">login</span>
    </a>
  </section>
</main>

</body>
</html>

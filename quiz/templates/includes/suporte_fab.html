{% comment %}
  Botão flutuante de suporte (FAB).
  Aparece em todas as páginas logadas.
  Clique abre menu com opção de novo ticket ou ver tickets.
{% endcomment %}

<div id="sos-fab" class="fixed bottom-6 left-6 z-40 md:hidden">
  <button id="sos-btn" onclick="toggleSOS()"
          class="w-12 h-12 rounded-full bg-secondary text-white shadow-xl flex items-center justify-center hover:scale-105 transition-transform"
          title="Suporte" aria-label="Abrir suporte">
    <span class="material-symbols-outlined" style="font-size:22px;font-variation-settings:'FILL' 1;">support_agent</span>
  </button>

  <div id="sos-menu" class="hidden absolute bottom-16 left-0 bg-white rounded-2xl shadow-2xl border border-slate-200 w-56 overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
      <span class="material-symbols-outlined text-secondary" style="font-size:18px;font-variation-settings:'FILL' 1;">support_agent</span>
      <p class="text-sm font-bold text-primary">Precisa de ajuda?</p>
    </div>
    <a href="{% url 'suporte_novo' %}?origem={{ request.path|urlencode }}" class="flex items-center gap-2 px-4 py-3 text-sm text-on-surface hover:bg-slate-50 transition-colors">
      <span class="material-symbols-outlined text-primary" style="font-size:16px;">add_comment</span>
      Abrir novo ticket
    </a>
    <a href="{% url 'suporte_lista' %}" class="flex items-center gap-2 px-4 py-3 text-sm text-on-surface hover:bg-slate-50 transition-colors border-t border-slate-100">
      <span class="material-symbols-outlined text-primary" style="font-size:16px;">forum</span>
      Meus tickets
    </a>
    <a href="{% url 'faq' %}" class="flex items-center gap-2 px-4 py-3 text-sm text-on-surface hover:bg-slate-50 transition-colors border-t border-slate-100">
      <span class="material-symbols-outlined text-primary" style="font-size:16px;">help</span>
      Ver FAQ
    </a>
  </div>
</div>

<script>
function toggleSOS() {
  const m = document.getElementById('sos-menu');
  m.classList.toggle('hidden');
}
document.addEventListener('click', function(e) {
  const fab = document.getElementById('sos-fab');
  if (fab && !fab.contains(e.target)) {
    document.getElementById('sos-menu').classList.add('hidden');
  }
});
</script>

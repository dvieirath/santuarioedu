<!-- PWA: manifest + service worker registration -->
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#002046"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SantuarioEdu"/>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
  });
}
</script>
<!-- Dark Mode: CSS overrides + init script (included in <head>) -->
<style id="dark-mode-overrides">
/* ── Base ─────────────────────────────────────────────────── */
html.dark body                              { background-color:#0f172a!important; color:#e2e8f0!important; }
/* ── Sidebar & sticky header ──────────────────────────────── */
html.dark aside                             { background-color:#0f172a!important; border-color:#1e293b!important; }
html.dark header.sticky                     { background-color:#0f172a!important; border-color:#1e293b!important; }
html.dark nav.fixed                         { background-color:#0f172a!important; border-color:#1e293b!important; }
/* ── Surface tokens ───────────────────────────────────────── */
html.dark .bg-surface                       { background-color:#0f172a!important; }
html.dark .bg-surface-container-lowest      { background-color:#1e293b!important; }
html.dark .bg-surface-container-low         { background-color:#1a2438!important; }
html.dark .bg-surface-container             { background-color:#172033!important; }
html.dark .bg-surface-container-high        { background-color:#1e293b!important; }
html.dark .bg-surface-container-highest     { background-color:#243044!important; }
/* ── Arbitrary bg values used in templates ────────────────── */
html.dark .bg-\[#f8f9fa\]                   { background-color:#0f172a!important; }
html.dark .bg-\[#edeeef\]                   { background-color:#172033!important; }
html.dark .hover\:bg-\[#edeeef\]:hover      { background-color:#1e293b!important; }
/* ── Border tokens ────────────────────────────────────────── */
html.dark .border-surface-container         { border-color:#1e293b!important; }
html.dark .border-surface-container-high    { border-color:#243044!important; }
html.dark .border-\[#edeeef\]               { border-color:#1e293b!important; }
html.dark .border-\[rgba\(255\,255\,255\,0\.07\)\] { border-color:rgba(255,255,255,.09)!important; }
html.dark .divide-y > *                     { border-color:#1e293b!important; }
/* ── Text tokens ──────────────────────────────────────────── */
html.dark .text-on-surface                  { color:#e2e8f0!important; }
html.dark .text-on-surface-variant          { color:#94a3b8!important; }
html.dark .text-slate-600                   { color:#94a3b8!important; }
html.dark .text-slate-400                   { color:#64748b!important; }
/* ── Primary / secondary tints in dark ───────────────────── */
html.dark .bg-primary-fixed                 { background-color:#1b3560!important; }
html.dark .bg-primary-container             { background-color:#1b3560!important; }
html.dark .bg-secondary-container           { background-color:#0a3d2e!important; }
html.dark .text-primary                     { color:#7ba7d4!important; }
html.dark .text-on-primary-container        { color:#aec7f7!important; }
/* ── Inputs & textareas ───────────────────────────────────── */
html.dark input:not([type=submit]):not([type=button]):not([type=reset]),
html.dark textarea,
html.dark select                            { background-color:#1e293b!important; border-color:#334155!important; color:#e2e8f0!important; }
/* ── Misc: shadows, table rows, code blocks ──────────────── */
html.dark [class*="shadow"]                 { box-shadow:0 4px 16px rgba(0,0,0,.45)!important; }
html.dark pre                               { background-color:#1e293b!important; filter:brightness(1.1); }
html.dark code                              { background-color:#1e293b!important; }
/* ── Admin base (already dark, keep consistent) ─────────── */
html.dark .bg-\[\#0d1117\]                  { background-color:#080d14!important; }
</style>
<script>
/* Apply saved theme before render to prevent flash */
(function(){
  var t=localStorage.getItem('prf_theme')||'light';
  document.documentElement.className=t;
})();
</script>

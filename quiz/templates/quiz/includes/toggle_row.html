<div class="flex items-center gap-4 px-5 py-4">
  <span class="material-symbols-outlined text-slate-400 shrink-0" style="font-variation-settings:'FILL' 1;">{{ icon }}</span>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">{{ title }}</p>
    <p class="text-xs text-slate-400">{{ desc }}</p>
  </div>
  <label class="relative inline-flex items-center cursor-pointer shrink-0">
    <input type="checkbox" name="{{ name }}" class="sr-only peer" {% if checked %}checked{% endif %}>
    <div class="w-10 h-6 bg-slate-200 dark:bg-slate-600 peer-focus:outline-none rounded-full peer
                peer-checked:bg-blue-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all
                peer-checked:after:translate-x-4"></div>
  </label>
</div>

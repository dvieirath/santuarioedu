name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/testes/security_frontend.test.cjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django check
        env:
          SECRET_KEY: test-secret-key-only-for-ci
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          GEMINI_API_KEY: dummy
          GROQ_API_KEY: dummy
          MP_ACCESS_TOKEN: dummy
          MP_PUBLIC_KEY: dummy
          # MP_WEBHOOK_SECRET intencionalmente vazio: com secret setado, o
          # webhook exige HMAC valido e retorna 403 sem assinatura — quebra o
          # teste de payload invalido que espera 400.
        run: python manage.py check

      - name: Run migrations check
        env:
          SECRET_KEY: test-secret-key-only-for-ci
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          GEMINI_API_KEY: dummy
          GROQ_API_KEY: dummy
          MP_ACCESS_TOKEN: dummy
          MP_PUBLIC_KEY: dummy
          # MP_WEBHOOK_SECRET intencionalmente vazio: com secret setado, o
          # webhook exige HMAC valido e retorna 403 sem assinatura — quebra o
          # teste de payload invalido que espera 400.
        run: python manage.py migrate --noinput

      - name: Collect static (necessario pro manifest do whitenoise)
        env:
          SECRET_KEY: test-secret-key-only-for-ci
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: python manage.py collectstatic --noinput

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-only-for-ci
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          GEMINI_API_KEY: dummy
          GROQ_API_KEY: dummy
          MP_ACCESS_TOKEN: dummy
          MP_PUBLIC_KEY: dummy
          # MP_WEBHOOK_SECRET intencionalmente vazio: com secret setado, o
          # webhook exige HMAC valido e retorna 403 sem assinatura — quebra o
          # teste de payload invalido que espera 400.
        run: python manage.py test quiz.tests --verbosity=1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit static analysis
        run: bandit -r quiz prf_master -ll || true

      - name: pip-audit (deps with CVEs)
        run: pip-audit -r requirements.txt || true

name: Backup diário do Postgres

# Roda todo dia às 03:00 UTC (00:00 horário Brasília)
# E permite disparar manualmente na aba Actions do GitHub
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  # Evita rodar 2 backups simultâneos se o job anterior demorar
  group: backup-db
  cancel-in-progress: false

jobs:
  dump-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Instalar client Postgres 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 || sudo apt-get install -y postgresql-client
          pg_dump --version

      - name: Instalar AWS CLI v2 (compat R2)
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Fazer pg_dump comprimido
        env:
          DATABASE_URL_RAW: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          # Strip defensivo: secrets pastados com \n ao final quebram pg_dump
          DATABASE_URL=$(echo -n "$DATABASE_URL_RAW" | tr -d '\n\r' | xargs)
          STAMP=$(date -u +'%Y-%m-%d_%H%M')
          FILE="backup_${STAMP}.sql.gz"
          echo "Fazendo dump para $FILE..."
          pg_dump --no-owner --no-acl --format=plain "$DATABASE_URL" | gzip -9 > "$FILE"
          ls -la "$FILE"
          echo "SIZE=$(stat -c%s "$FILE")" >> $GITHUB_ENV
          echo "FILE=$FILE" >> $GITHUB_ENV
          # Fail-safe: se dump ficou < 10KB, algo errado
          if [ "$(stat -c%s "$FILE")" -lt 10240 ]; then
            echo "❌ Dump muito pequeno (< 10KB), abortando"
            exit 1
          fi

      - name: Upload pro Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp "$FILE" "s3://$R2_BUCKET/backups/$FILE" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress
          echo "✅ Upload OK: s3://$R2_BUCKET/backups/$FILE"

      - name: Apagar backups mais velhos que 30 dias
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +'%Y-%m-%d')
          echo "Removendo backups antes de $CUTOFF..."
          aws s3 ls "s3://$R2_BUCKET/backups/" --endpoint-url "$R2_ENDPOINT" | while read -r line; do
            file=$(echo "$line" | awk '{print $4}')
            [ -z "$file" ] && continue
            # Extrai a data do nome do arquivo (backup_YYYY-MM-DD_HHMM.sql.gz)
            date_str=$(echo "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            [ -z "$date_str" ] && continue
            if [[ "$date_str" < "$CUTOFF" ]]; then
              echo "  Deletando antigo: $file"
              aws s3 rm "s3://$R2_BUCKET/backups/$file" --endpoint-url "$R2_ENDPOINT" --quiet
            fi
          done

      - name: Resumo
        run: |
          echo "Backup do dia $(date -u +'%Y-%m-%d %H:%M UTC') completo."
          echo "Arquivo: $FILE"
          echo "Tamanho: $(numfmt --to=iec $SIZE)"
